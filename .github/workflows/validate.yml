name: Validate CODELFA PARTNERS
on:
  push:
    branches:
      - partners-v1
    paths:
      - "app/**"
      - "worker/**"
      - "migrations/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "wrangler.toml"
      - ".github/workflows/validate.yml"
  pull_request:
    branches:
      - partners-v1
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npx tsc --noEmit
      - name: Build static app
        run: npm run build
