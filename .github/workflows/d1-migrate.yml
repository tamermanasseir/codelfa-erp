name: Apply CODELFA PARTNERS D1 migrations

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out partners-v1 migration files
        uses: actions/checkout@v4
        with:
          ref: partners-v1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply D1 migrations
        run: npx --yes wrangler@4 d1 migrations apply codelfa-partners-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
